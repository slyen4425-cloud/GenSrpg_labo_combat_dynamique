<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Combat Dynamique — Coop 2v2</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main class="game game--coop-2v2" data-combat-demo>
    <section class="arena arena--coop-2v2" data-combat-arena aria-label="Arène de combat coopératif 2 contre 2">
      <div class="arena__ground" aria-hidden="true"></div>

      <article
        class="fighter fighter--player"
        data-demo-slot="player"
        data-demo-view="player"
        data-demo-creature="loup_volcanique"
        data-target-actor="player"
        role="button"
        tabindex="0"
        aria-label="Sélectionner Loup volcanique"
      >
        <span class="visually-hidden" data-demo-label>Loup volcanique</span>
        <span class="fighter__shadow" data-demo-shadow aria-hidden="true"></span>\n        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Loup volcanique">
        </div>
      </article>

      <article
        class="fighter fighter--ally"
        data-demo-slot="ally"
        data-demo-view="player"
        data-demo-creature="golem_moussu"
        data-target-actor="ally"
        role="button"
        tabindex="0"
        aria-label="Sélectionner Golem moussu allié"
      >
        <span class="visually-hidden" data-demo-label>Golem moussu</span>
        <span class="fighter__shadow" data-demo-shadow aria-hidden="true"></span>\n        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Golem moussu allié">
        </div>
      </article>

      <article
        class="fighter fighter--opponent"
        data-demo-slot="opponent"
        data-demo-view="opponent"
        data-demo-creature="maraileron"
        data-target-actor="opponent"
        role="button"
        tabindex="0"
        aria-label="Sélectionner Maraileron adverse"
      >
        <span class="visually-hidden" data-demo-label>Maraileron</span>
        <span class="fighter__shadow" data-demo-shadow aria-hidden="true"></span>\n        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Maraileron adverse">
        </div>
      </article>

      <article
        class="fighter fighter--opponent-b"
        data-demo-slot="opponent-b"
        data-demo-view="opponent"
        data-demo-creature="braisombre"
        data-target-actor="opponent-b"
        role="button"
        tabindex="0"
        aria-label="Sélectionner Braisombre adverse"
      >
        <span class="visually-hidden" data-demo-label>Braisombre</span>
        <span class="fighter__shadow" data-demo-shadow aria-hidden="true"></span>\n        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Braisombre adverse">
        </div>
      </article>

      <button type="button" class="squad-card squad-card--player squad-card--local-full" data-target-actor="player">
        <strong>Loup volcanique</strong>
        <div class="squad-card__hp">
          <progress data-combat-hp="player" max="100" value="100"></progress>
          <span data-combat-hp-value="player">100 / 100 PV</span>
        </div>
        <div
          class="status-icons"
          data-combat-status-icons="player"
          aria-label="Buffs et debuffs actifs"
        ></div>
        <small data-combat-action="player">Prêt</small>
        <progress
          class="squad-card__charge squad-card__charge--local"
          data-combat-actor-charge="player"
          data-active="false"
          max="1"
          value="0"
          aria-label="Charge de la capacité du Loup volcanique"
        ></progress>
      </button>

      <button type="button" class="squad-card squad-card--opponent" data-target-actor="opponent">
        <strong>Maraileron</strong>
        <div class="squad-card__hp">
          <progress data-combat-hp="opponent" max="100" value="100"></progress>
          <span data-combat-hp-value="opponent">100 / 100 PV</span>
        </div>
        <div
          class="status-icons"
          data-combat-status-icons="opponent"
          aria-label="Buffs et debuffs actifs"
        ></div>
        <small data-combat-action="opponent">Prêt</small>
        <progress
          class="squad-card__charge"
          data-combat-actor-charge="opponent"
          data-active="false"
          max="1"
          value="0"
          aria-label="Charge de la capacité de Maraileron"
        ></progress>
      </button>

      <button type="button" class="squad-card squad-card--opponent-b" data-target-actor="opponent-b">
        <strong>Braisombre</strong>
        <div class="squad-card__hp">
          <progress data-combat-hp="opponent-b" max="100" value="100"></progress>
          <span data-combat-hp-value="opponent-b">100 / 100 PV</span>
        </div>
        <div
          class="status-icons"
          data-combat-status-icons="opponent-b"
          aria-label="Buffs et debuffs actifs"
        ></div>
        <small data-combat-action="opponent-b">Prêt</small>
        <progress
          class="squad-card__charge"
          data-combat-actor-charge="opponent-b"
          data-active="false"
          max="1"
          value="0"
          aria-label="Charge de la capacité de Braisombre"
        ></progress>
      </button>

      <div class="coop-command-stack">
        <button
          type="button"
          class="squad-card squad-card--ally squad-card--command-ally"
          data-target-actor="ally"
        >
          <img
            class="squad-card__creature-icon"
            data-ally-creature-icon
            alt=""
            aria-hidden="true"
          >
          <span class="squad-card__body">
            <strong>Golem moussu · allié</strong>
            <span class="squad-card__hp">
              <progress data-combat-hp="ally" max="100" value="100"></progress>
              <span data-combat-hp-value="ally">100 / 100 PV</span>
            </span>
            <span
              class="status-icons"
              data-combat-status-icons="ally"
              aria-label="Buffs et debuffs actifs"
            ></span>
            <small data-combat-action="ally">Prêt</small>
            <progress
              class="squad-card__charge"
              data-combat-actor-charge="ally"
              data-active="false"
              max="1"
              value="0"
              aria-label="Charge de la capacité du Golem moussu allié"
            ></progress>
          </span>
        </button>

        <section class="coop-controls" aria-label="Capacités du Loup volcanique">
          <div class="hud__energy">
            <div class="hud__energy-line">
              <strong>Votre énergie</strong>
              <span data-combat-energy-value="player">0 / 10⚡</span>
            </div>
            <progress
              data-combat-energy="player"
              max="10"
              value="0"
              aria-label="Énergie du Loup volcanique"
            ></progress>
          </div>
          <div class="skill-bar__grid" data-combat-skills></div>
        </section>
      </div>

      <p
        class="live-status live-status--coop"
        data-combat-live-status
        data-tone="info"
        role="status"
      >
        2v2 coop — touchez une créature pour choisir votre cible.
      </p>
    </section>
  </main>

  <script type="module" src="./coop-2v2.js"></script>
</body>
</html>
