<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Combat Dynamique — Vue joueur</title>
  <link rel="stylesheet" href="./demo.css">
</head>
<body>
  <main class="game" data-combat-demo>
    <section class="arena" data-combat-arena aria-label="Arène de combat">
      <div class="arena__ground" aria-hidden="true"></div>

      <article class="fighter fighter--player" data-demo-slot="player">
        <span class="visually-hidden" data-demo-label aria-hidden="true">Marai</span>
        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Monstre du joueur">
        </div>
      </article>

      <article class="fighter fighter--opponent" data-demo-slot="opponent">
        <span class="visually-hidden" data-demo-label aria-hidden="true">Drakon</span>
        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="Monstre adverse">
        </div>
      </article>

      <section class="combat-card combat-card--opponent" aria-label="Statut du monstre adverse">
        <div class="combat-card__title">
          <strong data-combat-name="opponent">Drakon</strong>
          <aside class="reserve reserve--opponent" aria-label="Réserve adverse">
            <span class="reserve__title">Réserve adverse</span>
            <div class="reserve__list" data-roster-reserve="opponent"></div>
          </aside>
        </div>
        <div class="combat-card__hp-row">
          <progress
            class="fighter__hp"
            data-combat-hp="opponent"
            max="100"
            value="100"
            aria-label="PV du monstre adverse"
          ></progress>
          <span data-combat-hp-value="opponent">100 / 100 PV</span>
        </div>
        <div class="fighter__charge-info" data-active="false">
          <strong data-combat-charge-name="opponent">Prêt</strong>
          <span data-combat-charge-time="opponent"></span>
        </div>
        <progress
          class="fighter__charge fighter__charge--reaction"
          data-combat-actor-charge="opponent"
          data-active="false"
          max="1"
          value="0"
          aria-label="Charge de la capacité du monstre adverse"
        ></progress>
      </section>

      <section class="combat-card combat-card--player" aria-label="Statut du monstre joueur">
        <div class="combat-card__title">
          <strong data-combat-name="player">Marai</strong>
          <aside class="reserve reserve--player" aria-label="Ma réserve">
            <span class="reserve__title">Ma réserve</span>
            <div class="reserve__list" data-roster-reserve="player"></div>
          </aside>
        </div>
        <div class="combat-card__hp-row">
          <progress
            class="fighter__hp"
            data-combat-hp="player"
            max="100"
            value="100"
            aria-label="PV du monstre joueur"
          ></progress>
          <span data-combat-hp-value="player">100 / 100 PV</span>
        </div>
        <div class="fighter__charge-info" data-active="false">
          <strong data-combat-charge-name="player">Prêt</strong>
          <span data-combat-charge-time="player"></span>
        </div>
        <progress
          class="fighter__charge"
          data-combat-actor-charge="player"
          data-active="false"
          max="1"
          value="0"
          aria-label="Charge de la capacité du monstre joueur"
        ></progress>
      </section>

      <section class="combat-controls" aria-label="Commandes du joueur">
        <div class="hud__energy">
          <div class="hud__energy-line">
            <strong>Énergie</strong>
            <span data-combat-energy-value="player">0 / 10⚡</span>
          </div>
          <progress
            data-combat-energy="player"
            max="10"
            value="0"
            aria-label="Énergie du monstre joueur"
          ></progress>
        </div>

        <div class="distance-buttons" aria-label="Distance">
          <button type="button" data-combat-move="short">Courte</button>
          <button type="button" data-combat-move="medium">Moyenne</button>
          <button type="button" data-combat-move="long">Longue</button>
        </div>

        <div class="combat-controls__actions">
          <section class="skill-bar" aria-label="Capacités">
            <span class="skill-bar__title">Capacités</span>
            <div class="skill-bar__grid" data-combat-skills></div>
          </section>

          <div class="action-bar action-bar--utility" aria-label="Actions secondaires">
            <details class="action-menu" data-action-menu>
              <summary>Objets</summary>
              <div class="action-menu__panel" data-combat-items></div>
            </details>

            <details class="action-menu" data-action-menu>
              <summary>Équipe</summary>
              <div class="action-menu__panel">
                <p class="team-selection" data-team-selection>
                  Réserve sélectionnée : Drakon
                </p>
                <div data-combat-team-actions></div>
              </div>
            </details>
          </div>
        </div>
      </section>

      <p
        class="live-status"
        data-combat-live-status
        data-tone="info"
        role="status"
      >
        Marai contre Drakon — choisis une action.
      </p>
    </section>
  </main>

  <script type="module" src="./demo.js"></script>
</body>
</html>
