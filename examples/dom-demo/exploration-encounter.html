<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GenSrpG — Combat Capture</title>
  <!-- Exactly the two stylesheets used by the authoring Combat preview. -->
  <link rel="stylesheet" href="./demo.css">
  <link rel="stylesheet" href="./capture-editor-v2.css">
  <style>
    body { margin: 0; background: #071016; }
    .encounter-fullscreen {
      position: absolute; z-index: 135;
      top: max(.4rem, env(safe-area-inset-top));
      left: max(.4rem, env(safe-area-inset-left));
      min-height: 2.25rem; padding: .32rem .65rem;
      border: 1px solid rgba(139, 232, 248, .6);
      border-radius: .8rem; background: rgba(4, 18, 24, .93);
      color: #eafaff; font: 700 12px system-ui, sans-serif;
      cursor: pointer; touch-action: manipulation;
    }
    .encounter-fullscreen[hidden] { display: none; }
    .bridge-banner { position: absolute; z-index: 145;
      bottom: max(.4rem, env(safe-area-inset-bottom));
      left: 50%; transform: translateX(-50%);
      max-width: min(94vw, 36rem);
      padding: .32rem .6rem; border-radius: .6rem;
      background: rgba(10, 20, 24, .85); color: #fff;
      font: 600 12px/1.25 system-ui, sans-serif;
      text-align: center; pointer-events: none; }
    .bridge-banner[data-state="ready"] { display: none; }
    .bridge-banner[data-state="error"] {
      display: block; background: rgba(92, 22, 22, .94);
      bottom: auto; top: 10%; }
  </style>
</head>
<body>
  <section class="capture-preview-shell" data-capture-preview-shell
           data-landscape-required="true" aria-label="Combat Capture issu de l'exploration">
    <div class="capture-preview-rotate-gate" role="status" aria-live="polite">
      <strong>Tourne ton téléphone</strong>
      <span>Le combat se joue en mode paysage.</span>
    </div>
    <div class="capture-preview-host" data-capture-preview-host>
      <p role="status" aria-busy="true">Chargement du combat Capture…</p>
    </div>
    <button type="button" class="encounter-fullscreen" data-encounter-fullscreen
            aria-label="Activer le véritable plein écran">
      ⛶ Plein écran
    </button>
    <p class="bridge-banner" data-bridge-status>Préparation du combat…</p>
  </section>
  <script type="module" src="./exploration-encounter.js?rev=exploration-native-view-2026-10-15"></script>
</body>
</html>
