<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GenSrpG — Combat Capture</title>
  <link rel="stylesheet" href="./demo.css">
  <style>
    .bridge-banner {
      position: fixed;
      z-index: 50;
      top: max(8px, env(safe-area-inset-top));
      left: 50%;
      transform: translateX(-50%);
      width: min(92vw, 680px);
      padding: .55rem .8rem;
      border-radius: 14px;
      background: rgba(14, 18, 20, .82);
      color: #fff;
      font: 600 14px/1.25 system-ui, sans-serif;
      text-align: center;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    .bridge-banner[data-state="error"] {
      background: rgba(92, 22, 22, .92);
    }
  </style>
</head>
<body>
  <p class="bridge-banner" data-bridge-status>
    Chargement de la rencontre…
  </p>

  <main class="game game--coop-2v2" data-combat-demo>
    <section class="arena arena--coop-2v2" data-combat-arena aria-label="Combat Capture issu de l'exploration">
      <div class="arena__ground" aria-hidden="true"></div>

      <article
        class="fighter fighter--player"
        data-demo-slot="local-1"
        data-demo-view="player"
        data-target-actor="local-1"
        role="button"
        tabindex="0"
      >
        <span class="visually-hidden" data-demo-label>Créature locale</span>
        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="">
        </div>
      </article>

      <article
        class="fighter fighter--opponent"
        data-demo-slot="enemy-1"
        data-demo-view="opponent"
        data-target-actor="enemy-1"
        role="button"
        tabindex="0"
      >
        <span class="visually-hidden" data-demo-label>Créature adverse</span>
        <div class="fighter__motion" data-demo-motion>
          <img class="fighter__image" data-demo-image alt="">
        </div>
      </article>

      <button
        type="button"
        class="squad-card squad-card--player squad-card--local-full"
        data-target-actor="local-1"
      >
        <strong>Votre créature</strong>
        <div class="squad-card__hp">
          <progress data-combat-hp="local-1" max="100" value="100"></progress>
          <span data-combat-hp-value="local-1">100 / 100 PV</span>
        </div>
        <div class="status-icons" data-combat-status-icons="local-1"></div>
        <small data-combat-action="local-1">Prêt</small>
        <progress
          class="squad-card__charge squad-card__charge--local"
          data-combat-actor-charge="local-1"
          data-active="false"
          max="1"
          value="0"
        ></progress>
      </button>

      <button
        type="button"
        class="squad-card squad-card--opponent"
        data-target-actor="enemy-1"
      >
        <strong>Adversaire</strong>
        <div class="squad-card__hp">
          <progress data-combat-hp="enemy-1" max="100" value="100"></progress>
          <span data-combat-hp-value="enemy-1">100 / 100 PV</span>
        </div>
        <div class="status-icons" data-combat-status-icons="enemy-1"></div>
        <small data-combat-action="enemy-1">Prêt</small>
        <progress
          class="squad-card__charge"
          data-combat-actor-charge="enemy-1"
          data-active="false"
          max="1"
          value="0"
        ></progress>
      </button>

      <div class="coop-command-stack">
        <section
          class="reserve reserve--player"
          aria-label="Équipe Capture"
        >
          <strong>Équipe</strong>
          <div
            class="reserve__list"
            data-roster-reserve="local-1"
          ></div>
          <p
            class="team-selection"
            data-team-selection
          >
            Aucune réserve sélectionnée
          </p>
          <div
            class="skill-bar__grid"
            data-combat-team-actions
          ></div>
        </section>

        <section class="coop-controls" aria-label="Capacités de la créature locale">
          <div class="hud__energy">
            <div class="hud__energy-line">
              <strong>Votre énergie</strong>
              <span data-combat-energy-value="local-1">0 / 0⚡</span>
            </div>
            <progress
              data-combat-energy="local-1"
              max="1"
              value="0"
            ></progress>
          </div>
          <div class="skill-bar__grid" data-combat-skills></div>
        </section>
      </div>

      <p
        class="live-status live-status--coop"
        data-combat-live-status
        data-tone="info"
        role="status"
      >
        Préparation du combat…
      </p>
    </section>
  </main>

  <script type="module" src="./exploration-encounter.js?rev=player-party-v1"></script>
</body>
</html>
