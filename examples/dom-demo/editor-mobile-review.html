<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Labo Capture — vérification mobile de l’éditeur</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; background: #071017; color: #d7e8ed; }
    body { margin: 0; padding: 1rem; }
    header { max-width: 50rem; margin: 0 auto 1rem; }
    h1 { font-size: 1.1rem; margin: 0 0 .4rem; }
    p { margin: .4rem 0; font-size: .82rem; }
    label { display: inline-flex; gap: .7rem; align-items: center; font-size: .8rem; }
    select { padding: .5rem; }
    iframe { display: block; width: 390px; height: 740px; max-width: 100%; margin: auto; border: 1px solid #42616d; border-radius: 1rem; background: #071017; }
  </style>
</head>
<body>
  <header>
    <h1>Éditeur natif — affichage mobile</h1>
    <p>La même page et les mêmes contrôles s’affichent dans une fenêtre étroite. Fais défiler les fiches pour vérifier la barre de test.</p>
    <label>Fenêtre de contrôle
      <select data-review-size>
        <option value="360,740">Portrait · 360 px</option>
        <option value="390,740" selected>Portrait · 390 px</option>
        <option value="430,740">Portrait · 430 px</option>
        <option value="740,390">Paysage · 740 px</option>
      </select>
    </label>
  </header>
  <iframe src="capture-editor-v2.html" title="Éditeur Capture natif" data-native-editor></iframe>
  <script type="module">
    const size = document.querySelector("[data-review-size]");
    const editor = document.querySelector("[data-native-editor]");
    size.addEventListener("change", () => {
      const [width, height] = size.value.split(",").map(Number);
      editor.style.width = width + "px";
      editor.style.height = height + "px";
    });
  </script>
</body>
</html>
