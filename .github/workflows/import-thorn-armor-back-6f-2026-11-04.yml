name: Import thorn armor Plante carnivore back-view 6 frames
on:
  push:
    branches:
      - work/lab-thorn-armor-back-overlay-2026-11-04
    paths:
      - scripts/import_thorn_armor_back_6f_2026_11_04.py
      - .github/workflows/import-thorn-armor-back-6f-2026-11-04.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: thorn-armor-back-6f-20261104
  cancel-in-progress: false
jobs:
  validated-media-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact media validator
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate ZIP and import only the true transparent back overlay
        run: |
          python -m py_compile scripts/import_thorn_armor_back_6f_2026_11_04.py
          python scripts/import_thorn_armor_back_6f_2026_11_04.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run catalog and all unit regression sentinels
        run: npm run ci
      - name: Commit exact approved media on scoped work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/armure_ronces_plante_carnivore/back
          git add -- data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No valid import output'; exit 1; }
          git commit -m 'assets(capture): import thorn-only armor back 6f'
          git push origin HEAD:work/lab-thorn-armor-back-overlay-2026-11-04
