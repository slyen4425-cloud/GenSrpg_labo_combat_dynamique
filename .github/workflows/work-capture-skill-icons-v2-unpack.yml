name: Capture skill icons V2 - one-time extract
on:
  push:
    branches:
      - work/global-assets-capture-skill-icons-v2-2026-10-11
    paths:
      - .github/workflows/work-capture-skill-icons-v2-unpack.yml
permissions:
  contents: write
jobs:
  extract-verified-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate archive and extract only expected icons
        shell: bash
        run: |
          set -euo pipefail
          archive="assets/library/capture/icons/skills/capture_skill_icons_v2_8_icones.zip"
          target="assets/library/capture/icons/skills"
          echo "b7e570c267a202e3ee478f56da5258619b8bda0a4b4d75dfd7a8c0eaadbfe40f  $archive" | sha256sum -c -
          mkdir -p "$target"
          expected=(
            icon_skill_seismic_shock_01.webp
            icon_skill_energy_blossom_01.webp
            icon_skill_burning_bite_01.webp
            icon_skill_healing_wave_01.webp
            icon_skill_rock_impact_01.webp
            icon_skill_earth_charge_01.webp
            icon_skill_flame_storm_01.webp
            icon_skill_pressurized_jet_01.webp
          )
          [[ "$(unzip -Z1 "$archive" | grep -Ec '\.webp$')" -eq 8 ]]
          for name in "${expected[@]}"; do
            [[ ! -e "$target/$name" ]]
            unzip -p "$archive" "$name" > "$target/$name"
            [[ "$(file -b --mime-type "$target/$name")" == "image/webp" ]]
          done
          cat > /tmp/icon-hashes.txt <<'HASHES'
          013f36e0702c5ff574cc730645750964ca995fcc234122bd616fb36db902f421  assets/library/capture/icons/skills/icon_skill_burning_bite_01.webp
          42369b2f23f35dae3818b7080ddfc77079b1cdff8ca8b498e2bd03c19e1d35e4  assets/library/capture/icons/skills/icon_skill_earth_charge_01.webp
          871d878c55904f2ac9695ccf485ddb836233f96cdd904272604fdfa7d483d8bd  assets/library/capture/icons/skills/icon_skill_energy_blossom_01.webp
          017b11cbeb0c7c83bec5fdd7f94c4da47a4fd17a11efc0a2ffbf9ebf4b59d310  assets/library/capture/icons/skills/icon_skill_flame_storm_01.webp
          47daffbddfaa4240cc8bd712f6cb2a7126b3741b50e7a579cad93f6d50186960  assets/library/capture/icons/skills/icon_skill_healing_wave_01.webp
          26df67a9dcc2820d2d52f08c82fb95db27de5cb4d39b51f9d8527aebf2c539d6  assets/library/capture/icons/skills/icon_skill_pressurized_jet_01.webp
          91a1512c1bf22ac98b69ece7d51fbf6d63430a4264a89227e6ebe091034ecc3f  assets/library/capture/icons/skills/icon_skill_rock_impact_01.webp
          ca5ea3439c3635dbe5d6549ac675a523dd00de8374e684092743e8d52ac2828d  assets/library/capture/icons/skills/icon_skill_seismic_shock_01.webp
          HASHES
          sha256sum -c /tmp/icon-hashes.txt
          git add -- "$target"/*.webp
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets(capture): extract eight verified skill icons v2"
          git push origin HEAD:work/global-assets-capture-skill-icons-v2-2026-10-11
