name: Import loup volcanique DOS 12 frames

on:
  push:
    branches:
      - work/global-assets-loup-volcanique-dos12-2026-10-21
    paths:
      - _incoming/LOUP_VOLCANIQUE_DOS_12_COURSE_ATTAQUE_PREVIEW.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wolf-dos12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-loup-volcanique-dos12-2026-10-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Vérifier puis importer les animations DOS validées
        run: python3 scripts/import_loup_volcanique_dos12.py
      - name: Lancer la CI sur les médias réels
        run: npm run ci
      - name: Écrire exclusivement les nouveaux assets dos et le catalogue
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/loup_volcanique/animations/movement/dos
          git add assets/library/capture/creatures/loup_volcanique/animations/attack/dos
          git add data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git commit -m "assets(capture): publier course et attaque dos 12 frames loup volcanique"
          git push origin HEAD:work/global-assets-loup-volcanique-dos12-2026-10-21
