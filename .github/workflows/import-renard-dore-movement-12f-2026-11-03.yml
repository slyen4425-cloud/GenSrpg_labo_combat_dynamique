name: Import approved golden spirit fox movement 12f
on:
  push:
    branches:
      - work/lab-renard-dore-movement-12f-2026-11-03
    paths:
      - scripts/import_renard_dore_movement_player_12_2026_11_03.py
      - .github/workflows/import-renard-dore-movement-12f-2026-11-03.yml
permissions:
  contents: write
concurrency:
  group: import-renard-dore-movement-12f-2026-11-03
  cancel-in-progress: false
jobs:
  validate-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Compile strict author source importer
        run: python -m py_compile scripts/import_renard_dore_movement_player_12_2026_11_03.py
      - name: Verify the GitHub ZIP and import exact frames
        run: python scripts/import_renard_dore_movement_player_12_2026_11_03.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate catalog and new binary sentinel
        run: npm run ci
      - name: Commit tested artwork to work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/library/capture/creatures/renard_magique_dore/animations/movement/player data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo "Missing generated fox movement files"; exit 1; }
          git commit -m "assets(capture): register approved golden fox movement player 12f"
          git push origin HEAD:work/lab-renard-dore-movement-12f-2026-11-03
