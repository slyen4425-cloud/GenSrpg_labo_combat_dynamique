name: Heriplante 12f artist archive inspection
on:
  push:
    branches:
      - work/lab-heriplante-player-attack-movement-12f-2026-11-04
    paths:
      - .github/workflows/audit-heriplante-12f-2026-11-04.yml
      - scripts/audit_heriplante_12f_2026_11_04.py
permissions:
  contents: read
jobs:
  review-archives:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Validate deposited archive manifests, exact source SHA and graphic assets
        run: python scripts/audit_heriplante_12f_2026_11_04.py
