name: Import approved Fleur defense 12f Capture sprite
on:
  push:
    branches:
      - work/lab-fleur-defense-spore-soporifique-2026-10-28
    paths:
      - scripts/import_fleur_defense_12f.py
      - .github/workflows/import-fleur-defense-12f.yml
permissions:
  contents: write
concurrency:
  group: capture-fleur-defense-12f-import-2026-10-28
  cancel-in-progress: false
jobs:
  import-verified-original-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify uploaded archive SHA and ZIP CRC, originals, RGBA frames, alpha and preview; construct WebP atlas
        run: python scripts/import_fleur_defense_12f.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full laboratory CI including author skill transfer and real asset sentinel
        run: npm run ci
      - name: Commit true extracted 12 PNGs, original preview, atlas and catalog on work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/fleur_defense_12_frames_512.zip assets/library/capture/sprites/skills/fleur_defense data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): register approved Fleur defense 12f real media'
          git push origin HEAD:work/lab-fleur-defense-spore-soporifique-2026-10-28
