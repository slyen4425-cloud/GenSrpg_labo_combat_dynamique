name: Import approved pieuvre assets
on:
  push:
    branches:
      - work/pieuvre-library-2026-10-27
    paths:
      - scripts/import-pieuvre-approved.py
      - .github/workflows/import-approved-pieuvre.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Extract and validate approved PNGs
        run: python3 scripts/import-pieuvre-approved.py
      - name: Verify asset registration
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          c=json.loads(Path('data/assets/catalog/global-visual-assets.v1.json').read_text())
          a=[x for x in c['assets'] if x['id'].startswith('pack:capture:creature-pieuvre-')]
          assert len(a)==3
          assert all((Path('assets/library')/x['resource']['file']).is_file() for x in a)
          assert len({x['id'] for x in c['assets']})==len(c['assets'])
          PY
      - name: Commit generated media and catalog on preparation branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/pieuvre data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --exit-code || (git commit -m "assets: register approved pieuvre views and icon" && git push)
