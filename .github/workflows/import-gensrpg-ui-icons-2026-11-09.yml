name: Import 18 approved GenSRPG UI icons
on:
  push:
    branches:
      - work/lab-ui-icons-18-2026-11-09
    paths:
      - scripts/install_gensrpg_ui_icons_2026_11_09.py
      - tests/unit/gensrpg-ui-icons-2026-11-09.test.mjs
      - .github/workflows/import-gensrpg-ui-icons-2026-11-09.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gensrpg-ui-icons-v1-import-2026-11-09
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lab-ui-icons-18-2026-11-09
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validator for archived original pack
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify and extract the exact approved ZIP, import into canonical catalog
        run: python scripts/install_gensrpg_ui_icons_2026_11_09.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify entire catalog, tests and 18 real UI icons
        run: npm run ci
      - name: Commit official media without touching main or gameplay
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/library/core/icons/ui/ data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo "Expected 18 approved icons were not created"; exit 1; }
          git commit -m "assets(ui): register 18 validated stat and element medallions"
          git fetch origin work/lab-ui-icons-18-2026-11-09
          git rebase origin/work/lab-ui-icons-18-2026-11-09
          git push origin HEAD:work/lab-ui-icons-18-2026-11-09
