name: Sleep editor one-time migration
on:
  push:
    branches:
      - work/lab-sleep-target-conditions-2026-10-28
    paths:
      - scripts/lab-sleep-human-editor-20261028.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply guarded editor migration
        run: python scripts/lab-sleep-human-editor-20261028.py
      - name: Assert only the intended runtime file changed
        run: |
          git diff --check
          git diff --name-only | grep -Fx src/ui/capture-editor-human-v2.js
          test "$(git diff --name-only | wc -l)" -eq 1
      - name: Commit changed Human Editor on the isolated work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/ui/capture-editor-human-v2.js
          git commit -m "feat(editor): expose sleep until damage and conditional effects with canonical selectors"
          git push origin HEAD:work/lab-sleep-target-conditions-2026-10-28
