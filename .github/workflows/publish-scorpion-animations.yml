name: Publish approved scorpion animations
on:
  push:
    branches: [global-assets]
    paths: ['.github/workflows/publish-scorpion-animations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/import_scorpion_animations.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/scorpion/ data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet || (git commit -m "assets: publish validated scorpion animations" && git push)
