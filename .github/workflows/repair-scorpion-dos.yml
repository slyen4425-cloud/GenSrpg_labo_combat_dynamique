name: Repair scorpion DOS animations
on:
  push:
    branches: [global-assets]
    paths: ['.github/workflows/repair-scorpion-dos.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/repair_scorpion_dos.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/scorpion/animations
          git diff --cached --quiet || (git commit -m "assets: publish scorpion DOS files for catalog entries" && git push)
