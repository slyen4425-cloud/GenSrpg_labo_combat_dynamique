name: Import Guêpe cybernétique FACE 12f cleaned
on:
  push:
    branches:
      - work/global-assets-guepe-face12-2026-10-25
    paths:
      - scripts/import_guepe_face12.py
      - scripts/guepe-face12.test.template.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-guepe-face12-2026-10-25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/global-assets-guepe-face12-2026-10-25
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import actual artist-approved ZIP
        run: python3 scripts/import_guepe_face12.py
      - name: Validate actual media and laboratory
        run: npm run ci
      - name: Commit real assets to isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/guepe_cybernetique/animations/
          git add data/assets/catalog/global-visual-assets.v1.json
          git add tests/unit/guepe-face12-assets.test.mjs
          git add docs/LAB_CURRENT_WORK.md
          git diff --cached --check
          git commit -m 'assets(capture): importer 24 frames FACE guepe cybernetique'
          git push origin HEAD:work/global-assets-guepe-face12-2026-10-25
