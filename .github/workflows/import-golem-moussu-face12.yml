name: Import Golem moussu face 12 frames

on:
  push:
    branches:
      - work/global-assets-golem-moussu-face12-2026-10-21
    paths:
      - _incoming/GOLEM_MOUSSU_FACE_12_COURSE_ATTAQUE_GITHUB.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: golem-moussu-face12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-golem-moussu-face12-2026-10-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importer les 24 PNG sources immuables
        run: python3 scripts/import_golem_moussu_face12.py
      - name: Lancer CI sur fichiers réellement importés
        run: npm run ci
      - name: Commit assets et catalogue sans toucher aux modèles officiels
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/golem_moussu/animations
          git add data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git commit -m "assets(capture): importer mouvement et attaque golem moussu face 12 frames"
          git push origin HEAD:work/global-assets-golem-moussu-face12-2026-10-21
