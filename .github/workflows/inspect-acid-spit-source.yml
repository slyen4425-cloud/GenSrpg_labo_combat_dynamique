name: Inspect acid spit source ZIP contents
on:
  push:
    branches:
      - work/global-assets-acid-spit-fx-2026-10-24
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Show source zip entries and PNG header data
        run: |
          python - <<'PY'
          import hashlib, os, struct, zipfile
          from pathlib import Path
          source=Path('_incoming/crachat-acide')
          zips=sorted(source.glob('*.zip'))
          assert len(zips)==4, f'ZIP_COUNT={len(zips)}'
          for archive in zips:
              data=archive.read_bytes()
              print('ARCHIVE',archive.name,'BYTES',len(data),'SHA256',hashlib.sha256(data).hexdigest(),flush=True)
              with zipfile.ZipFile(archive) as z:
                  print('ENTRIES',len(z.infolist()),'CRC',z.testzip(),flush=True)
                  for item in z.infolist():
                      if item.is_dir(): continue
                      name=item.filename
                      b=z.read(item)
                      shape=''
                      if b[:8]==b'\x89PNG\r\n\x1a\n':
                          w,h=struct.unpack('>II',b[16:24]);shape=f'PNG {w}x{h} type{b[25]}'
                      elif b[:4]==b'RIFF' and b[8:12]==b'WEBP':
                          shape='WEBP'
                      elif b[:3]==b'GIF':shape='GIF'
                      print('FILE',repr(name),len(b),shape,flush=True)
          PY
      - name: Inspect source manifests
        run: |
          python - <<'PY'
          import json,zipfile
          from pathlib import Path
          for p in sorted(Path('_incoming/crachat-acide').glob('*.zip')):
              with zipfile.ZipFile(p) as z:
                  m=[n for n in z.namelist() if n.endswith('/manifest.json')]
                  assert len(m)==1
                  obj=json.loads(z.read(m[0]).decode('utf-8'))
                  print('MANIFEST',p.name,json.dumps(obj,ensure_ascii=False,sort_keys=True),flush=True)
          PY
