name: Laboratory CI

on:
  push:
  pull_request:

jobs:
  foundation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ci

  creature-library-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real Chromium creature library startup smoke
        run: node tests/browser/capture-creature-library-smoke.mjs
      - name: Real Chromium 2.5D arena shadow and flying light projection
        run: node tests/browser/shadow-light-real-render-smoke.mjs
      - name: Real Chromium Capture Bestiaire (front only)
        run: node tests/browser/capture-bestiary-smoke.mjs

  firestorm-zone-growth-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real Chromium Firestorm player and AI zone growth (1v1 / 2v2)
        run: node tests/browser/firestorm-zone-growth-smoke.mjs

  expanding-wave-2v2-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real Chromium expanding wave on two independent 2v2 targets
        run: node tests/browser/expanding-wave-2v2-smoke.mjs

  expanding-wave-mobile-preview-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Real Chromium standalone 2v2 mobile preview startup
        run: node tests/browser/expanding-wave-mini-preview-smoke.mjs
