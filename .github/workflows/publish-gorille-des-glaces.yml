name: Publish approved ice gorilla masters to canonical library
on:
  push:
    branches: [work/gorille-des-glaces-canonical-2026-10-27]
    paths:
      - '.github/workflows/publish-gorille-des-glaces.yml'
      - 'scripts/publish_gorille_des_glaces.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python scripts/publish_gorille_des_glaces.py
