name: Import approved spherical spore cloud V2 Capture media
on:
  push:
    branches:
      - work/lab-spores-spheriques-v2-2026-10-28
    paths:
      - scripts/import_spores_spheriques_v2.py
      - .github/workflows/import-spores-spheriques-v2.yml
permissions:
  contents: write
concurrency:
  group: spores-spheriques-v2-import-2026-10-29
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify source ZIP byte identity, CRC, original 12 RGBA images, exact atlas and preview
        run: python scripts/import_spores_spheriques_v2.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full CI including real visual source sentinel
        run: npm run ci
      - name: Commit canonical Capture media and catalog on dedicated work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- _incoming/GENSRPG_NUAGE_SPORES_SPHERIQUE_AUTOUR_CREATURE_V2_12F_WEBP.zip assets/library/capture/sprites/skills/spores_spheriques_v2 data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): import spherical spores radial V2 original 12f WebP'
          git push origin HEAD:work/lab-spores-spheriques-v2-2026-10-28
