name: Stone Carapace Aura Trim One Shot

on:
  push:
    branches:
      - work/global-assets-stone-carapace-aura-trim-v1-2026-10-10
    paths:
      - .github/workflows/trim-stone-carapace-aura-one-shot-v1.yml

permissions:
  contents: write

jobs:
  trim-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/global-assets-stone-carapace-aura-trim-v1-2026-10-10
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install 'Pillow>=11,<12'
      - name: Trim existing pixels, update canonical manifest and catalogue
        run: python scripts/trim-stone-carapace-aura-hold-last-v1.py
      - name: Commit binary asset output on isolated branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/sprites/skills/stone_carapace/ data/assets/catalog/global-visual-assets.v1.json scripts/build-stone-carapace-vfx-pack-v1.py docs/LAB_STONE_CARAPACE_VFX_ASSETS_V1.md
          git diff --cached --check
          git diff --cached --quiet && { echo "No changes found"; exit 1; }
          git commit -m "assets: trim stone carapace aura to complete frame 12 (12/16)"
          git push origin HEAD:work/global-assets-stone-carapace-aura-trim-v1-2026-10-10

# one-shot retry after visible RGB fidelity check
