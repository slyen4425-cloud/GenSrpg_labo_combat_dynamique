name: Import loup volcanique face 12 frames

on:
  push:
    branches:
      - work/global-assets-loup-volcanique-face12-2026-10-21
    paths:
      - _incoming/LOUP_VOLCANIQUE_COURSE_ATTAQUE_FACE_12_FRAMES_GITHUB.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: wolf-face12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-loup-volcanique-face12-2026-10-21'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Importer les 24 images approuvées
        run: python3 scripts/import_loup_volcanique_face12.py
      - name: Tests du labo et des sentinelles
        run: npm run ci
      - name: Commit d'assets vérifiés (branche isolée)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/loup_volcanique/animations data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git commit -m "assets(capture): importer course et attaque loup volcanique face 12 frames"
          git push origin HEAD:work/global-assets-loup-volcanique-face12-2026-10-21
