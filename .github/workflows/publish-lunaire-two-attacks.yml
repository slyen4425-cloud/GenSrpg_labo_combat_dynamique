name: Publish lunar two attacks
on:
  push:
    branches: [work/lab-lunaire-two-attacks-20261026]
    paths: [.github/workflows/publish-lunaire-two-attacks.yml, scripts/publish_lunaire_two_attacks.py]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow
      - run: python scripts/publish_lunaire_two_attacks.py
      - run: npm run ci
      - name: Commit assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/creature_lunaire/animations/attack
          git diff --cached --check
          git commit -m 'assets: publish both validated lunar attack animations'
          git push origin HEAD:work/lab-lunaire-two-attacks-20261026
