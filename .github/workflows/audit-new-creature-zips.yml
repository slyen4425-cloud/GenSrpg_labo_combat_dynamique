name: Audit new creature animation archives
on:
  push:
    branches: [global-assets]
    paths: ['.github/workflows/audit-new-creature-zips.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-assets
      - run: python scripts/audit_new_creature_zips.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SCORPION_SOURCE_AUDIT.json
          git diff --cached --quiet || (git commit -m "audit: inventory uploaded animation archives before import" && git push)
