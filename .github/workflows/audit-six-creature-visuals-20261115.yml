name: Audit six validated Monster Capture author ZIPs
on:
  push:
    branches:
      - work/lab-six-creature-visuals-20261115
    paths:
      - scripts/audit-six-creature-visuals-20261115.py
      - .github/workflows/audit-six-creature-visuals-20261115.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  author-archive-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=11,<13'
      - name: Inspect six real author ZIP bytes, image size and transparency
        run: python scripts/audit-six-creature-visuals-20261115.py
