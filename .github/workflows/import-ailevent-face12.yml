name: Import Ailevent FACE user-approved animations
on:
  push:
    branches: [work/global-assets-ailevent-face-2026-10-25]
    paths: [scripts/import_ailevent_face12.py, scripts/ailevent-face12.test.template.mjs]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-ailevent-face-2026-10-25'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/global-assets-ailevent-face-2026-10-25
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: python3 scripts/import_ailevent_face12.py
      - run: npm run ci
      - name: Commit verified media to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/ailevent/animations/
          git add data/assets/catalog/global-visual-assets.v1.json
          git add docs/LAB_CURRENT_WORK.md
          git add tests/unit/ailevent-face12-assets.test.mjs
          git diff --cached --check
          git commit -m 'assets(capture): Ailevent FACE 12f vol et attaque'
          git push origin HEAD:work/global-assets-ailevent-face-2026-10-25
