name: Import Loup volcanique V3 existing animation previews
on:
  push:
    branches:
      - work/global-assets-wolf-animation-v3-review-2026-10-20
    paths:
      - "_incoming/Loup_volcanique_V3_*_POUR_GITHUB.zip"
      - "scripts/import_loup_volcanique_v3_review.py"
      - ".github/workflows/import-loup-volcanique-v3-review.yml"
permissions:
  contents: write
jobs:
  preview-only:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install review-media tools
        run: python -m pip install 'Pillow>=10,<13'
      - name: Import supplied animation frames and verify exact media
        run: python scripts/import_loup_volcanique_v3_review.py
      - name: Commit only review media when all four sources are present
        run: |
          set -eu
          REVIEW=assets/library/capture/creatures/loup_volcanique/animation_previews_v3
          if [ ! -f "$REVIEW/review_manifest.json" ]; then
            echo "One or more author ZIPs missing; nothing published"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$REVIEW"
          if ! git diff --cached --quiet; then
            git commit -m 'assets(capture): publish wolf V3 four animation previews for author review'
            git push origin HEAD:refs/heads/work/global-assets-wolf-animation-v3-review-2026-10-20
          fi
