name: Bestiary idle GIF canonical import
on:
  pull_request:
    branches: [main]
    paths: ['scripts/import-bestiary-idle-gif-20261125.py', '.github/workflows/import-bestiary-idle-gif-20261125.yml', 'tests/unit/bestiary-idle-gif-20261125.test.mjs', 'scripts/idle-import-build/**']
  push:
    branches: [main]
    paths: ['scripts/import-bestiary-idle-gif-20261125.py', '.github/workflows/import-bestiary-idle-gif-20261125.yml', 'scripts/idle-import-build/**']
permissions:
  contents: read
concurrency:
  group: bestiary-idle-gif-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: canonical
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Render only corrected Voltige DOS with pinned independent atelier
        run: |
          git clone --depth 1 --branch v0.6.1 https://github.com/jaisurya-dev-art/rigby2d.git "$RUNNER_TEMP/rigby2d"
          (cd "$RUNNER_TEMP/rigby2d" && npm ci && npx playwright install --with-deps chromium)
          export CANONICAL_ROOT="$PWD/canonical"
          cd source/scripts/idle-import-build
          PYTHONPATH=scripts python -c 'import render_bestiary_idles as r; c=r.CFG["creatures"]["voltige"]; r.render("voltige","dos",c,c["views"]["dos"])'
      - uses: actions/upload-artifact@v4
        with:
          name: voltige-dos-corrected-preview
          path: source/scripts/idle-import-build/idle-review/voltige/dos/
      - name: Verify and stage exact GIFs twice
        run: |
          python source/scripts/import-bestiary-idle-gif-20261125.py canonical report.json "$PWD/source/scripts/idle-import-build/idle-review/voltige/dos"
          python source/scripts/import-bestiary-idle-gif-20261125.py canonical report-repeat.json "$PWD/source/scripts/idle-import-build/idle-review/voltige/dos"
          cmp report.json report-repeat.json
          git -C canonical diff --check
          GEN_IDLE_CATALOG="$PWD/canonical/data/assets/catalog/global-visual-assets.v1.json" GEN_IDLE_REPORT="$PWD/report.json" node --test source/tests/unit/bestiary-idle-gif-20261125.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bestiary-idle-bindings
          path: report.json
      - name: Build read-only review sheets for reserved idle pairs
        if: github.event_name == 'pull_request'
        run: python source/scripts/idle-import-build/review-reserved-idles.py canonical reserved-idle-review
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'pull_request'
        with:
          name: reserved-idle-visual-review
          path: reserved-idle-review/
          if-no-files-found: error
      - name: Publish canonical files only from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: canonical
        run: |
          git add -- assets/library/capture/creatures data/assets/catalog/global-visual-assets.v1.json tests/unit
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only --diff-filter=A | grep -c '\.gif$')" -eq 46
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(capture): 46 author-deposited bestiary idle GIFs'
          git push origin HEAD:global-assets
