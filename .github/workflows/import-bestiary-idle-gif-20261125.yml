name: Bestiary idle GIF canonical import
on:
  pull_request:
    branches: [main]
    paths: ['scripts/import-bestiary-idle-gif-20261125.py', '.github/workflows/import-bestiary-idle-gif-20261125.yml', 'tests/unit/bestiary-idle-gif-20261125.test.mjs']
  push:
    branches: [main]
    paths: ['scripts/import-bestiary-idle-gif-20261125.py', '.github/workflows/import-bestiary-idle-gif-20261125.yml']
permissions:
  contents: read
concurrency:
  group: bestiary-idle-gif-import
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: canonical
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Verify and stage exact GIFs twice
        run: |
          python source/scripts/import-bestiary-idle-gif-20261125.py canonical report.json
          python source/scripts/import-bestiary-idle-gif-20261125.py canonical report-repeat.json
          cmp report.json report-repeat.json
          git -C canonical diff --check
          GEN_IDLE_CATALOG="$PWD/canonical/data/assets/catalog/global-visual-assets.v1.json" GEN_IDLE_REPORT="$PWD/report.json" node --test source/tests/unit/bestiary-idle-gif-20261125.test.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: bestiary-idle-bindings
          path: report.json
      - name: Publish canonical files only from main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: canonical
        run: |
          git add -- assets/library/capture/creatures data/assets/catalog/global-visual-assets.v1.json tests/unit
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only --diff-filter=A | grep -c '\.gif$')" -eq 46
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(capture): 46 author-deposited bestiary idle GIFs'
          git push origin HEAD:global-assets
