name: Import approved summonable ice walls 3x12
on:
  push:
    branches:
      - work/lab-ice-persistent-walls-assets-2026-11-01
    paths:
      - scripts/import_ice_persistent_walls.py
      - .github/workflows/import-ice-persistent-walls.yml
permissions:
  contents: write
concurrency:
  group: lab-ice-persistent-walls-assets-2026-11-01
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification
        run: python -m pip install 'Pillow>=10,<13'
      - name: Python syntax validation
        run: python -m py_compile scripts/import_ice_persistent_walls.py
      - name: Verify original source and create exact 12f wall atlas media
        run: python scripts/import_ice_persistent_walls.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full canonical asset CI
        run: npm run ci
      - name: Commit verified VFX to the working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/murs_glace data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo 'Generated wall assets missing'; exit 1; }
          git commit -m 'assets(capture): import 3 official summonable persistent ice wall sprites'
          git push origin HEAD:work/lab-ice-persistent-walls-assets-2026-11-01
