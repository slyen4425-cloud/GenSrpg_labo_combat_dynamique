name: Import fleur defensive original ZIP (12 frames)
on:
  push:
    branches:
      - work/lab-fleur-defense-vfx-2026-10-28
    paths:
      - scripts/import_fleur_defense_vfx.py
      - .github/workflows/import-fleur-defense-vfx.yml
permissions:
  contents: write
concurrency:
  group: fleur-defense-import-2026-10-28
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify source and import media plus canonical assetId
        run: python scripts/import_fleur_defense_vfx.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full CI including real media test
        run: npm run ci
      - name: Commit exact approved media and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/fleur_defense_12_frames_512.zip assets/library/capture/sprites/skills/flower_defense data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): import original 12-frame defensive flower FX'
          git push origin HEAD:work/lab-fleur-defense-vfx-2026-10-28
