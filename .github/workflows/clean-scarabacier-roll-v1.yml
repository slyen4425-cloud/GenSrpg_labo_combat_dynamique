name: Scarabacier roll artifact cleanup review
on:
  push:
    branches:
      - "work/global-assets-scarabacier-roll-clean-v1-2026-10-19"
    paths:
      - ".github/workflows/clean-scarabacier-roll-v1.yml"
      - "scripts/clean_scarabacier_roll_v1.py"
permissions:
  contents: write
jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact media validators
        run: python -m pip install "Pillow>=10,<13" "numpy>=2,<3" "opencv-python-headless>=4.10,<5"
      - name: Clean original 16 frames and regenerate preview plus atlas
        run: python scripts/clean_scarabacier_roll_v1.py
      - name: Assert source assetId stays unchanged
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("assets/library/capture/creatures/scarabacier/animations/roll/scarabacier_roll.manifest.json")
          j=json.loads(p.read_text())
          assert j["assetId"] == "pack:capture:creature-scarabacier-roll-01"
          assert j["frameCount"] == 16
          assert j["cleanup"]["status"] == "ready_for_author_ingame_review"
          print("Validated roll contract and approval hold")
          PY
      - name: Commit corrected review media on working branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/library/capture/creatures/scarabacier/animations/roll
          if ! git diff --cached --quiet; then
            git commit -m 'assets(capture): preview cleaned Scarabacier roll without new sprites'
            git push origin HEAD:refs/heads/work/global-assets-scarabacier-roll-clean-v1-2026-10-19
          fi
