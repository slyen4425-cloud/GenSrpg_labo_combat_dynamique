name: Import four validated Veuve jaune animations into canonical global-assets
on:
  push:
    branches:
      - main
      - work/veuve-jaune-4-anims-20261125
    paths:
      - scripts/import-veuve-jaune-4-animations-20261125.py
      - .github/workflows/import-veuve-jaune-4-animations-20261125.yml
  pull_request:
    branches: [main]
    paths:
      - scripts/import-veuve-jaune-4-animations-20261125.py
      - .github/workflows/import-veuve-jaune-4-animations-20261125.yml

permissions:
  contents: write

jobs:
  canonical-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout uploaded ZIPs from current source branch
        uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: true
      - name: Checkout the single canonical catalog
        uses: actions/checkout@v4
        with:
          ref: global-assets
          path: canonical
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=11,<13'
      - name: Import and verify four exact author ZIPs
        run: python source/scripts/import-veuve-jaune-4-animations-20261125.py source canonical
      - name: Validate exact media, unique catalog IDs and preserved official masters
        working-directory: canonical
        run: |
          git diff --check
          python - <<'PY'
          import json
          from pathlib import Path
          from PIL import Image
          cat=json.loads(Path('data/assets/catalog/global-visual-assets.v1.json').read_text())
          prov=json.loads(Path('assets/library/capture/creatures/veuve_jaune/veuve_jaune.animations.provenance.json').read_text())
          meta=json.loads(Path('assets/library/capture/creatures/veuve_jaune/veuve_jaune.meta.json').read_text())
          assert len(prov['items'])==4
          assert cat['counts']['assets']==len(cat['assets'])==507
          assert len({a['id'] for a in cat['assets']})==507
          assert cat['counts']['sprites']==257
          by_id={a['id']:a for a in cat['assets']}
          assert len({a['file'] for a in prov['items']})==4
          for entry in prov['items']:
              obj=by_id[entry['id']]
              assert obj['resource']['file']==entry['file']
              assert obj['resource']['frameCount']==entry['runtimeFrames']
              assert obj['resource']['playbackMode']==entry['playbackMode']
              assert entry['id'] in meta['assetIds'].values()
              with Image.open(Path('assets/library')/entry['file']) as img:
                  assert img.format=='WEBP'
                  assert img.size==(512*entry['runtimeFrames'],512)
          assert meta['views']=={
            'opponent':'runtime/veuve_jaune_face.png',
            'player':'runtime/veuve_jaune_dos.png',
            'icon':'runtime/veuve_jaune_icone.png'
          }
          print('PASS: four exact approved media, seven Veuve jaune avatar/animation slots, unchanged masters')
          PY
      - name: Publish only from the merged main branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: canonical
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- assets/library/capture/creatures/veuve_jaune             data/assets/catalog/global-visual-assets.v1.json             tests/unit/capture-ephemus-media-assets-20261118.test.mjs             tests/unit/veldra-skill-media-assets-20261118.test.mjs             tests/unit/capture-cheval-de-feu-icon-catalog-20261121.test.mjs
          git diff --cached --check
          test "$(git diff --cached --name-only | grep -E '[.]webp$' | wc -l)" -eq 4
          git commit -m 'assets(capture): publish four validated Veuve jaune motion and attack strips'
          git push origin HEAD:global-assets
