name: One-shot electric beam ZIP import (normalized CSV)
on:
  push:
    branches:
      - work/global-assets-electric-beam-yellow-v1-2026-10-13
    paths:
      - .github/workflows/temp-electric-beam-yellow-import-v1.yml
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Extract exact uploaded assets and verify hashes
        run: python scripts/import-electric-beam-yellow-v1.py
      - name: Commit only canonical extracted assets and delete staging ZIP files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/sprites/skills/electric_beam_yellow
          git rm -- rayon_electrique_jaune_01_cast.zip rayon_electrique_jaune_02_corps.zip rayon_electrique_jaune_03_impact.zip
          git diff --cached --check
          git commit -m "assets(capture): extract verified electric yellow beam media from uploaded ZIPs"
          git push origin HEAD:refs/heads/work/global-assets-electric-beam-yellow-v1-2026-10-13
