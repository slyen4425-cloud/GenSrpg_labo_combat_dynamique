name: One-time Scarabacier Rear Claw Repair

on:
  push:
    branches:
      - 'work/lab-scarabacier-claw-2026-10-19'
    paths:
      - '.github/workflows/repair-scarabacier-claw.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verification dependencies
        run: python -m pip install pillow numpy
      - name: Repair only the clipped Scarabacier rear claw
        run: python scripts/repair_scarabacier_player_claw.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify laboratory CI and the whole capture asset catalog
        run: npm run ci
      - name: Record exact real WebP bytes on isolated work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/scarabacier/runtime/scarabacier_player.webp
          git diff --cached --quiet && { echo "Missing expected WebP change"; exit 1; }
          git commit -m "fix(capture): remove detached Scarabacier rear claw artifact"
          git push origin HEAD:work/lab-scarabacier-claw-2026-10-19
