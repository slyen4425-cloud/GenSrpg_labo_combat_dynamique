name: Temporary Fireball Sprite Slice

on:
  push:
    branches:
      - work/lab-fireball-sprites-clean-capture-2026-09-25

permissions:
  contents: write

jobs:
  build-fireball-sprites:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow
      - name: Generate cleaned fireball frames
        run: python scripts/_tmp_fireball_slice.py
      - name: Commit generated Capture assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/sprites/skills/fireball
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "assets: generate cleaned Capture fireball frames"
            git push origin HEAD:work/lab-fireball-sprites-clean-capture-2026-09-25
          fi
