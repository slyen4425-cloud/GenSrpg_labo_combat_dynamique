name: Import thorn armor Plante carnivore 6 frames
on:
  push:
    branches:
      - work/lab-thorn-armor-overlay-2026-11-03
    paths:
      - scripts/import_thorn_armor_6f_2026_11_03.py
      - .github/workflows/import-thorn-armor-plante-carnivore-6f.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: import-thorn-armor-6f-20261103
  cancel-in-progress: false
jobs:
  import-validated-thorn-only:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image verifier
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate exact source and import only thorn mask
        run: |
          python -m py_compile scripts/import_thorn_armor_6f_2026_11_03.py
          python scripts/import_thorn_armor_6f_2026_11_03.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify canonical catalog and full sentinels
        run: npm run ci
      - name: Commit verified assets without touching old assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/armure_ronces_plante_carnivore
          git add -- data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'No validated asset diff'; exit 1; }
          git commit -m 'assets(capture): import approved thorn-only armor overlay 6f'
          git push origin HEAD:work/lab-thorn-armor-overlay-2026-11-03
