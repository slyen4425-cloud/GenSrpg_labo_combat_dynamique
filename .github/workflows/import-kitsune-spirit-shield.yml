name: Import approved Kitsune spiritual sphere shield
on:
  push:
    branches:
      - work/global-assets-kitsune-spirit-shield-v1-2026-10-22
    paths:
      - '_incoming/KITSUNE_BOUCLIER_SPIRITUEL_ORBE_20F.zip'
      - 'scripts/import_kitsune_spirit_shield_v1.py'
      - '.github/workflows/import-kitsune-spirit-shield.yml'
permissions:
  contents: write
concurrency:
  group: kitsune-spirit-shield-import-v1
  cancel-in-progress: false
jobs:
  import-approved-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify approved 20-frame ZIP, preserve original RGBA frames and build atlas
        run: python scripts/import_kitsune_spirit_shield_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physical frames and whole laboratory
        run: npm run ci
      - name: Commit original sprite frames on isolated work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/kitsune_spirit_shield data/assets/catalog/global-visual-assets.v1.json _incoming/KITSUNE_BOUCLIER_SPIRITUEL_ORBE_20F.zip
          git commit -m 'assets(capture): import approved full-sphere Kitsune spiritual shield'
          git push origin HEAD:work/global-assets-kitsune-spirit-shield-v1-2026-10-22
