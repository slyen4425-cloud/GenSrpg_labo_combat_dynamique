name: Import approved Kitsune spiritual sphere shield
on:
  push:
    branches:
      - work/global-assets-kitsune-spirit-shield-v1-2026-10-22
    paths:
      - '_incoming/Sprites de boucliers magiques lunaires.png'
permissions:
  contents: write
concurrency:
  group: kitsune-spirit-shield-import-v1
  cancel-in-progress: false
jobs:
  import-approved-visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Slice exact approved full-sphere sheet (never generate artwork)
        run: python scripts/import_kitsune_spirit_shield_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physical frames and whole laboratory
        run: npm run ci
      - name: Commit approved sprite assets on isolated work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/kitsune_spirit_shield data/assets/catalog/global-visual-assets.v1.json '_incoming/Sprites de boucliers magiques lunaires.png'
          git commit -m 'assets(capture): import approved full-sphere Kitsune spiritual shield'
          git push origin HEAD:work/global-assets-kitsune-spirit-shield-v1-2026-10-22
