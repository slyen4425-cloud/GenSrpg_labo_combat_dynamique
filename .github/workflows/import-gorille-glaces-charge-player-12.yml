name: Import Gorilla ice charge player 12 frames
on:
  push:
    branches:
      - work/lab-gorille-glaces-charge-player-2026-11-02
    paths:
      - scripts/import_gorille_glaces_charge_player_12.py
      - .github/workflows/import-gorille-glaces-charge-player-12.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: gorille-glaces-charge-player-12
  cancel-in-progress: false
jobs:
  source-verified-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PNG and lossless WebP verifier
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify source ZIP, extract approved RGBA and build exact strip
        run: |
          python -m py_compile scripts/import_gorille_glaces_charge_player_12.py
          python scripts/import_gorille_glaces_charge_player_12.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify physical animation media, catalog, and full regression suite
        run: npm run ci
      - name: Commit only validated Gorilla media and canonical catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/creatures/gorille_des_glaces/animations/attack/player
          git add -- data/assets/catalog/global-visual-assets.v1.json docs/LAB_CURRENT_WORK.md
          git diff --cached --check
          git diff --cached --quiet && { echo 'No imported asset diff'; exit 1; }
          git commit -m 'assets(capture): import 12 frame Gorilla charge player animation'
          git push origin HEAD:work/lab-gorille-glaces-charge-player-2026-11-02
