name: Import Dracendre validated idle GIFs
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import-dracendre-idle-20261125.py
      - .github/workflows/import-dracendre-idle-20261125.yml
  push:
    branches: [main]
    paths:
      - scripts/import-dracendre-idle-20261125.py
      - .github/workflows/import-dracendre-idle-20261125.yml
permissions:
  contents: read
concurrency:
  group: canonical-dracendre-idle
  cancel-in-progress: false
jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: canonical
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install Pillow==11.3.0
      - name: Recover original Dracendre FACE/DOS from immutable Rigby run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 45597597085 --repo slyen4425-cloud/GensRPG-Atelier-Animation --name rigby-preview --dir original
          test -f original/dracendre/face/idle/preview.gif
          test -f original/dracendre/dos/idle/preview.gif
      - name: Stage only two previously rendered GIFs and verify 12 distinct frames
        run: |
          python source/scripts/import-dracendre-idle-20261125.py canonical original
          git -C canonical diff --check
      - name: Publish official media only after merged Combat main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: canonical
        run: |
          git add -- assets/library/capture/creatures/braisombre/animations/idle data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          if git diff --cached --quiet; then exit 0; fi
          test "$(git diff --cached --name-only --diff-filter=A | grep -c '\.gif$')" -eq 2
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(capture): Dracendre FACE/DOS validated Rigby2D idle GIFs'
          git push origin HEAD:global-assets
