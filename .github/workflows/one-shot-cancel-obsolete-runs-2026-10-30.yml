# Single-use operations tool. This branch is NEVER merged into gh-pages.
# Only two exact October 7 CI runs may be cancelled, and only if still queued.
name: One-shot cleanup of verified obsolete October 7 CI runs
on:
  push:
    branches:
      - work/lab-one-shot-obsolete-action-cancel-2026-10-30
    paths:
      - '.github/workflows/one-shot-cancel-obsolete-runs-2026-10-30.yml'
permissions:
  contents: read
  actions: write
jobs:
  targeted-obsolete-run-cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Cancel only the two verified obsolete October 7 queued runs
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_REPOSITORY: slyen4425-cloud/GenSrpg_labo_combat_dynamique
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REPOSITORY" = "$EXPECTED_REPOSITORY"
          expected_sha='e87a6acc4c5a2262cb466d2001d698aeb7e9bbd5'
          for record in \
            '37642387886:preview/lab-cendre-author-export-v3-2026-10-07' \
            '37642387764:checkpoint/lab-cendre-author-export-v3-green-2026-10-07'
          do
            run_id="${record%%:*}"
            expected_branch="${record#*:}"
            details="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run_id")"
            actual_branch="$(jq -r '.head_branch' <<< "$details")"
            actual_sha="$(jq -r '.head_sha' <<< "$details")"
            state="$(jq -r '.status' <<< "$details")"
            created="$(jq -r '.created_at' <<< "$details")"
            if [[ "$actual_branch" != "$expected_branch" || "$actual_sha" != "$expected_sha" ]]; then
              echo "::error::Refusing unexpected run $run_id : $actual_branch@$actual_sha"
              exit 1
            fi
            if [[ "$created" > '2026-10-08T00:00:00Z' ]]; then
              echo "::error::Refusing new run $run_id at $created"
              exit 1
            fi
            if [[ "$state" == completed ]]; then
              echo "Run $run_id already completed; no action needed."
              continue
            fi
            if [[ "$state" != queued && "$state" != pending && "$state" != waiting ]]; then
              echo "::error::Refusing active or unknown status for $run_id: $state"
              exit 1
            fi
            gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null
            echo "Requested cancellation of obsolete queued CI $run_id ($expected_branch)."
          done
