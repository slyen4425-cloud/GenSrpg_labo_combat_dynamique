name: Import approved Feuille tranchante V3 Capture WebP assets
on:
  push:
    branches:
      - work/lab-feuille-tranchante-v3-2026-10-28
    paths:
      - scripts/import_feuille_tranchante_v3.py
      - .github/workflows/import-feuille-tranchante-v3.yml
permissions:
  contents: write
concurrency:
  group: feuille-tranchante-v3-import
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify source ZIP hash, CRC, alpha, atlas, 36 frames and import exactly
        run: python scripts/import_feuille_tranchante_v3.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run real source asset test and complete repository CI
        run: npm run ci
      - name: Commit and publish ONLY validated canonical Capture assets to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- _incoming/FEUILLE_TRANCHANTE_STYLISE_V3_3x12_WEBP.zip assets/library/capture/sprites/skills/feuille_tranchante_v3 data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): import original Feuille tranchante V3 3x12 WebP skills'
          git push origin HEAD:work/lab-feuille-tranchante-v3-2026-10-28
