name: Build frost bolt VFX pack v1

on:
  push:
    branches:
      - work/global-assets-frost-bolt-vfx-pack-v1-2026-10-06

permissions:
  contents: write

jobs:
  build-assets:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Build and validate frost bolt pack
        run: python scripts/build-frost-bolt-vfx-pack-v1.py
      - name: Commit generated frost bolt pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "assets: build frost bolt VFX pack v1"
          git push origin HEAD:${{ github.ref_name }}
