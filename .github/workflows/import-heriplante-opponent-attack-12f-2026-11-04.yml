name: Import approved Heriplante opponent attack 12f
on:
  push:
    branches:
      - work/lab-heriplante-opponent-attack-course-12f-2026-11-04
    paths:
      - scripts/import_heriplante_attack_opponent_12_2026_11_04.py
      - .github/workflows/import-heriplante-opponent-attack-12f-2026-11-04.yml
permissions:
  contents: write
concurrency:
  group: heriplante-opponent-attack-2026-11-04
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Validate source archive and extract the exact 12 approved frames
        run: python scripts/import_heriplante_attack_opponent_12_2026_11_04.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All global-assets tests
        run: npm run ci
      - name: Commit validated media on work branch only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/library/capture/creatures/heriplante/animations/attack/opponent data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo "No approved assets generated"; exit 1; }
          git commit -m "assets(capture): register original Heriplante opponent attack 12f"
          git fetch origin work/lab-heriplante-opponent-attack-course-12f-2026-11-04
          git rebase origin/work/lab-heriplante-opponent-attack-course-12f-2026-11-04
          git push origin HEAD:work/lab-heriplante-opponent-attack-course-12f-2026-11-04
