name: Import Kitsune four animations into global library
on:
  push:
    branches: [work/global-assets-kitsune-lunaire-4-2026-10-26]
    paths: [.github/workflows/import-kitsune-lunaire-global-assets.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch origin gh-pages
      - run: python scripts/import_kitsune_lunaire_global_assets.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ci
      - name: Commit only four library assets and catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/creature_lunaire/animations data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git commit -m 'assets: register four Kitsune lunar animations in global library'
          git push origin HEAD:work/global-assets-kitsune-lunaire-4-2026-10-26
