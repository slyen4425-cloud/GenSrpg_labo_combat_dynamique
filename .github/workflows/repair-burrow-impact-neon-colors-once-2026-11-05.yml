name: One-time clean source impact neon color defects
on:
  push:
    branches: [work/lab-burrow-impact-color-artifact-2026-11-05]
    paths:
      - .github/workflows/repair-burrow-impact-neon-colors-once-2026-11-05.yml
permissions:
  contents: write
jobs:
  repair-source-art:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deterministic image builder
        run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Repair only provably neon source RGBA
        run: python scripts/repair-burrow-impact-neon-colors-2026-11-05.py --write
      - name: Validate actual PNGs and atlas
        run: |
          python scripts/repair-burrow-impact-neon-colors-2026-11-05.py --check
          node --test \
            tests/unit/capture-burrow-impact-color-artifact-2026-11-05.test.mjs \
            tests/unit/capture-burrow-impact-artwork-alpha-audit-2026-11-05.test.mjs
      - name: Commit only actual owned asset files
        run: |
          git add assets/library/capture/sprites/skills/burrow_terrain/impact/frames/*.png
          git add assets/library/capture/sprites/skills/burrow_terrain/impact/sprite_burrow_impact_atlas.webp
          git diff --cached --check
          test "$(git diff --cached --name-only | wc -l)" -ge 6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(art): remove vivid red/yellow/green source noise and rebuild burrow impact atlas'
          git push origin HEAD:work/lab-burrow-impact-color-artifact-2026-11-05
