name: Import approved golden fox opponent attack 12f
on:
  push:
    branches:
      - work/lab-renard-dore-attack-opponent-12f-2026-11-04
    paths:
      - scripts/import_renard_dore_attack_opponent_12_2026_11_04.py
      - .github/workflows/import-renard-dore-attack-opponent-12f-2026-11-04.yml
permissions:
  contents: write
concurrency:
  group: import-renard-dore-attack-opponent-12f-2026-11-04
  cancel-in-progress: false
jobs:
  validate-and-import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Compile strict importer
        run: python -m py_compile scripts/import_renard_dore_attack_opponent_12_2026_11_04.py
      - name: Verify exact uploaded ZIP and import approved artwork
        run: python scripts/import_renard_dore_attack_opponent_12_2026_11_04.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run real catalog and PNG source sentinels
        run: npm run ci
      - name: Commit validated media ONLY to work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/library/capture/creatures/renard_magique_dore/animations/attack/opponent data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo "No official opponent attack assets generated"; exit 1; }
          git commit -m "assets(capture): add approved Renard dore opponent attack 12f"
          git fetch origin work/lab-renard-dore-attack-opponent-12f-2026-11-04
          git rebase origin/work/lab-renard-dore-attack-opponent-12f-2026-11-04
          git push origin HEAD:work/lab-renard-dore-attack-opponent-12f-2026-11-04
