name: Import Maraileron real swim and attack assets
on:
  push:
    branches:
      - work/global-assets-maraileron-swim-attack-2026-10-23
    paths:
      - scripts/import_maraileron_swim_attack.py
      - scripts/maraileron-swim-attack.test.template.mjs
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/global-assets-maraileron-swim-attack-2026-10-23
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Import exactly approved media
        run: python3 scripts/import_maraileron_swim_attack.py
      - name: Validate actual media and full laboratory CI
        run: npm run ci
      - name: Publish validated files to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/maraileron/animations/
          git add data/assets/catalog/global-visual-assets.v1.json
          git add tests/unit/maraileron-swim-attack-assets.test.mjs
          git diff --cached --check
          git commit -m 'assets(capture): importer 18 sprites Maraileron nage et attaque'
          git push origin HEAD:work/global-assets-maraileron-swim-attack-2026-10-23
