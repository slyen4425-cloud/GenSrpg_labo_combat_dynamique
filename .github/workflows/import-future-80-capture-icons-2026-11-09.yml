name: Import approved 80 future Capture skill icons (two series)
on:
  push:
    branches:
      - work/lab-future-skill-icons-80-2026-11-09
    paths:
      - scripts/import_future_80_capture_icons_2026_11_09.py
      - .github/workflows/import-future-80-capture-icons-2026-11-09.yml
permissions:
  contents: write
concurrency:
  group: lab-future-80-capture-icons-2026-11-09
  cancel-in-progress: false
jobs:
  import-verified-icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Verify script syntax
        run: python -m py_compile scripts/import_future_80_capture_icons_2026_11_09.py
      - name: Validate exact author ZIPs and import 80 icons
        run: python scripts/import_future_80_capture_icons_2026_11_09.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full repository CI on imported real media
        run: npm run ci
      - name: Commit generated canonical media to isolated work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/icons/skills/icon_skill_*.webp assets/library/capture/icons/skills/capture_future_80_icons_2026_11_09.provenance.json data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo 'Expected generated media missing'; exit 1; }
          git commit -m 'assets(capture): register 80 author-approved future skill icons'
          git push origin HEAD:work/lab-future-skill-icons-80-2026-11-09