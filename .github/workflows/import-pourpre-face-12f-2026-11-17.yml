name: Import approved POURPRE front run + attack 12f
on:
  push:
    branches:
      - work/lab-pourpre-face-12f-2026-11-17
    paths:
      - '.github/workflows/import-pourpre-face-12f-2026-11-17.yml'
      - 'scripts/import_creature_pourpre_face_12f_2026_11_17.py'
      - 'tests/unit/creature-pourpre-face-12f-assets-2026-11-17.test.mjs'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lab-pourpre-face-12f-2026-11-17
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check Pillow
      - name: Inspect sources and import two real PNG sequences
        run: python scripts/import_creature_pourpre_face_12f_2026_11_17.py
      - name: Test entire lab with real media
        run: npm run ci
      - name: Commit only POURPRE opponent animations and canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          git add assets/library/capture/creatures/creature_pourpre/animations/movement/opponent/ \
            assets/library/capture/creatures/creature_pourpre/animations/attack/opponent/ \
            data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --name-only | while IFS= read -r changed; do
            case "$changed" in
              assets/library/capture/creatures/creature_pourpre/animations/movement/opponent/*|assets/library/capture/creatures/creature_pourpre/animations/attack/opponent/*|data/assets/catalog/global-visual-assets.v1.json) ;;
              *) echo "Unexpected file changed: $changed"; exit 1 ;;
            esac
          done
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "assets(pourpre): publish two approved front animations 12f"
            git push origin HEAD:refs/heads/work/lab-pourpre-face-12f-2026-11-17
          fi
