name: Import original Liane epineuse beam Capture 12f WebP
on:
  push:
    branches:
      - work/lab-liane-epineuse-rayon-2026-10-29
    paths:
      - scripts/import_liane_epineuse_rayon.py
      - .github/workflows/import-liane-epineuse-rayon.yml
permissions:
  contents: write
concurrency:
  group: liane-epineuse-rayon-import-2026-10-29
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate original ZIP SHA Git blob CRC 12 RGBA frames pixel-identical strip and real animated preview
        run: python scripts/import_liane_epineuse_rayon.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full lab CI including real asset and one-catalog sentinel
        run: npm run ci
      - name: Commit verified untouched approved media onto work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- _incoming/GENSRPG_LIANE_EPINEUSE_RAYON_12F_WEBP.zip assets/library/capture/sprites/skills/liane_epineuse_rayon data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): publish real thorn-vine beam 12f sprites'
          git push origin HEAD:work/lab-liane-epineuse-rayon-2026-10-29
