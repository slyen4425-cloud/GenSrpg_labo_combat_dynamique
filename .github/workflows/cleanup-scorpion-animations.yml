name: Clean misclassified scorpion animations
on:
  push:
    branches: [global-assets]
    paths: ['.github/workflows/cleanup-scorpion-animations.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/cleanup_scorpion_animations.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A assets/library/capture/creatures/scorpion
          git diff --cached --quiet || (git commit -m "cleanup: remove wrongly assigned scorpion runtime animations" && git push)
