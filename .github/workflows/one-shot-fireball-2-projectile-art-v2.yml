name: One-shot Fireball 2 projectile art v2
# retry-alpha-tight
# retry-coverage-balanced
# retry-head-300

on:
  push:
    branches:
      - work/lab-global-assets-fireball-2-projectile-scale-art-v2-2026-10-05
    paths:
      - .github/workflows/one-shot-fireball-2-projectile-art-v2.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lab-global-assets-fireball-2-projectile-scale-art-v2-2026-10-05
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate Fireball 2 projectile art V2
        run: python tools/one-shot-fireball-2-projectile-art-v2.py

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify full laboratory CI
        run: npm run ci

      - name: Remove one-shot machinery
        run: |
          rm -f tools/one-shot-fireball-2-projectile-art-v2.py
          rm -f .github/workflows/one-shot-fireball-2-projectile-art-v2.yml

      - name: Commit Fireball 2 projectile art V2
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: rebuild Fireball 2 projectile art v2"
          git push origin HEAD:work/lab-global-assets-fireball-2-projectile-scale-art-v2-2026-10-05
