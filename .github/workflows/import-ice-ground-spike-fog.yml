name: Import approved Ice ground spike fog pack (3x12)
on:
  push:
    branches:
      - work/lab-ice-ground-spike-fog-2026-10-31
    paths:
      - scripts/import_ice_ground_spike_fog.py
      - .github/workflows/import-ice-ground-spike-fog.yml
permissions:
  contents: write
concurrency:
  group: lab-ice-ground-spike-fog-2026-10-31
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image decoder
        run: python -m pip install 'Pillow>=10,<13'
      - name: Validate import source script syntax before touching the canonical assets
        run: python -m py_compile scripts/import_ice_ground_spike_fog.py
      - name: Validate original 43 ZIP members and assemble 3 pixel-exact atlas strips
        run: python scripts/import_ice_ground_spike_fog.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run full repository CI and canonical real asset sentinels
        run: npm run ci
      - name: Commit generated verified assets to work branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/glace_suite data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo 'Generated media missing'; exit 1; }
          git commit -m 'assets(capture): 3 approved Ice VFX 12f and official global-assets records'
          git push origin HEAD:work/lab-ice-ground-spike-fog-2026-10-31
