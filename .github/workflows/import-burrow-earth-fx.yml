name: Import approved Burrow Earth FX
on:
  push:
    branches:
      - work/lab-burrow-ground-fx-v2-2026-10-24
    paths:
      - 'scripts/import_burrow_earth_fx_v1.py'
      - '.github/workflows/import-burrow-earth-fx.yml'
      - '_incoming/ATTAQUE_SOUTERRAINE_FX_01_DEPART_20F.zip'
      - '_incoming/ATTAQUE_SOUTERRAINE_FX_02_TRAJET_20F.zip'
      - '_incoming/ATTAQUE_SOUTERRAINE_FX_03_IMPACT_20F.zip'
permissions:
  contents: write
concurrency:
  group: import-burrow-earth-fx-v1
  cancel-in-progress: false
jobs:
  import-verified-burrow-media:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify source ZIP and install original 60 frames with 3 WebP atlases
        run: python scripts/import_burrow_earth_fx_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run unit and contract checks
        run: npm run ci
      - name: Commit checked media on isolated branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- assets/library/capture/sprites/skills/burrow_earth
          git commit -m 'assets(capture): import three approved underground FX sprites'
          git push origin HEAD:work/lab-burrow-ground-fx-v2-2026-10-24
