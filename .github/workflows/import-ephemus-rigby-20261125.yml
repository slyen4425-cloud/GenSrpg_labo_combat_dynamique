name: Import six approved Ephemus Rigby2D clips
on:
  pull_request:
    branches: [main]
    paths:
      - scripts/import-ephemus-rigby-20261125.py
      - .github/workflows/import-ephemus-rigby-20261125.yml
      - data/capture/showcase/Ephemus.capture-creature-transfer-v1.json
  push:
    branches: [main]
    paths:
      - scripts/import-ephemus-rigby-20261125.py
      - .github/workflows/import-ephemus-rigby-20261125.yml
      - data/capture/showcase/Ephemus.capture-creature-transfer-v1.json
permissions:
  contents: read
concurrency:
  group: ephemus-rigby-import-${{ github.ref }}
  cancel-in-progress: false
jobs:
  import-ephemus:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: source
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          path: canonical
          ref: global-assets
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install Pillow==11.3.0
      - name: Import and verify the six approved clips
        run: |
          python source/scripts/import-ephemus-rigby-20261125.py canonical
          python source/scripts/import-ephemus-rigby-20261125.py canonical
          git -C canonical diff --check
          GEN_EPHEMUS_CATALOG="$PWD/canonical/data/assets/catalog/global-visual-assets.v1.json" node --test source/tests/unit/ephemus-rigby-bindings-20261125.test.mjs
      - name: Publish only from authoritative main after validation
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        working-directory: canonical
        run: |
          git add -- assets/library/capture/creatures/ephemus data/assets/catalog/global-visual-assets.v1.json tests/unit/capture-ephemus-media-assets-20261118.test.mjs tests/unit/veldra-skill-media-assets-20261118.test.mjs tests/unit/capture-cheval-de-feu-icon-catalog-20261121.test.mjs
          git diff --cached --check
          if git diff --cached --quiet; then echo 'Already imported and verified'; exit 0; fi
          test "$(git diff --cached --name-only | grep -E '\.png$' | wc -l)" -eq 6
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'assets(capture): six exact approved Ephemus Rigby2D animations'
          git push origin HEAD:global-assets
