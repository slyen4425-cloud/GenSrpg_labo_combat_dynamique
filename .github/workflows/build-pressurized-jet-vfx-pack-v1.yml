name: Build Pressurized Jet VFX Pack V1

on:
  push:
    branches:
      - work/global-assets-pressurized-jet-vfx-v1-2026-10-08
    paths:
      - ".github/workflows/build-pressurized-jet-vfx-pack-v1.yml"
      - "scripts/build-pressurized-jet-vfx-pack-v1.py"
      - ".tmp/pressurized-jet-vfx-v1/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact branch
        uses: actions/checkout@v4
        with:
          ref: work/global-assets-pressurized-jet-vfx-v1-2026-10-08
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check pillow

      - name: Build deterministic asset pack
        run: python scripts/build-pressurized-jet-vfx-pack-v1.py

      - name: Verify no transfer fragments remain
        run: test ! -e .tmp/pressurized-jet-vfx-v1

      - name: Commit generated pack
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --stat
          git diff --cached --quiet && exit 0
          git commit -m "assets: build pressurized jet VFX pack v1"
          git push origin HEAD:work/global-assets-pressurized-jet-vfx-v1-2026-10-08
