name: Import approved Graine sansue projectile and debuff 2x12 WebP
on:
  push:
    branches:
      - work/lab-graine-sangsue-vfx-2026-10-28
    paths:
      - scripts/import_graine_sangsue_vfx.py
      - .github/workflows/import-graine-sangsue-vfx.yml
permissions:
  contents: write
concurrency:
  group: graine-sangsue-vfx-import-2026-10-28
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify original ZIP SHA and Git blob, CRC, WebP pixels, previews, and hold frame; import
        run: python scripts/import_graine_sangsue_vfx.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full repository CI with real 24-frame sentinel
        run: npm run ci
      - name: Commit imported original media and sole catalog to work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- _incoming/GRAINE_SANSUE_PROJECTILE_DEBUFF_2x12_WEBP.zip assets/library/capture/sprites/skills/graine_sangsue data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): publish approved Graine sansue projectile and debuff media'
          git push origin HEAD:work/lab-graine-sangsue-vfx-2026-10-28
