name: Import Braisombre face vol et attaque 12 frames

on:
  push:
    branches:
      - work/global-assets-braisombre-face12-2026-10-22
    paths:
      - _incoming/BRAISOMBRE_FACE_12_VOL_ATTAQUE_GITHUB_2026-10-22.zip
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: braisombre-face12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  import:
    if: github.ref == 'refs/heads/work/global-assets-braisombre-face12-2026-10-22'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          ref: ${{ github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Valider l'archive et importer les vrais médias
        run: python3 scripts/import_braisombre_face12.py
      - name: Vérifier les vraies images et les sentinelles
        run: npm run ci
      - name: Committer les assets sans changer runtime ou autres créatures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/creatures/braisombre/animations
          git add data/assets/catalog/global-visual-assets.v1.json
          git add tests/unit/braisombre-face12-assets.test.mjs
          git diff --cached --check
          git commit -m "assets(capture): importer vol et attaque Braisombre face 12 frames"
          git push origin HEAD:work/global-assets-braisombre-face12-2026-10-22
