name: Capture Air VFX V1 one-time build
on:
  push:
    branches:
      - work/lab-capture-air-vfx-pack-v1-2026-10-11
    paths:
      - .github/workflows/capture-air-vfx-v1-one-time.yml
permissions:
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check Pillow==11.3.0
      - name: Verify sources and build 80 transparent 512px frames and mobile atlases
        run: python scripts/prepare-capture-air-vfx-v1.py
      - name: Commit verified assets only
        shell: bash
        run: |
          set -euo pipefail
          git add -- assets/library/capture/sprites/skills/air_*/
          test "$(git diff --cached --name-only | grep -Ec '/frames/.*[.]png$')" -eq 80
          test "$(git diff --cached --name-only | grep -Ec '/atlases/.*[.]webp$')" -eq 4
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "assets(capture): build Air VFX frames and mobile atlases from verified sources"
          git push origin HEAD:work/lab-capture-air-vfx-pack-v1-2026-10-11
