name: Import Fluide Meteorite VFX
on:
  push:
    branches:
      - work/lab-fluide-meteorite-assets-2026-10-15
    paths:
      - _incoming/fluide_meteorite_upload_github.zip
permissions:
  contents: write
jobs:
  validate-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - run: python scripts/import_fluide_meteorite_zip.py
      - name: Publish actual media to the same working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/sprites/skills/fluide_meteorite _incoming/fluide_meteorite_upload_github.zip
          git commit -m 'assets(capture): import real Fluide Meteorite 60-frame VFX pack'
          git push origin HEAD:work/lab-fluide-meteorite-assets-2026-10-15
