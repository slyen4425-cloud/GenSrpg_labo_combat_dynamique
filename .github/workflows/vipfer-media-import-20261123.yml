name: Vipfer media upload — verified import
on:
  push:
    branches: [work/global-vipfer-media-20261123]
    paths: ['.github/workflows/vipfer-media-import-20261123.yml']
permissions:
  contents: write
jobs:
  validate-import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/global-vipfer-media-20261123
          persist-credentials: true
          sparse-checkout: |
            .github/workflows/vipfer-media-import-20261123.yml
            assets/library/capture/creatures/vipfer
            data/assets/catalog/global-visual-assets.v1.json
            assets/library/capture/icons/skills/vipfer
            assets/library/capture/sprites/skills/vipfer
      - name: Install image inspection library
        run: python -m pip install Pillow --quiet
      - name: Inspect author's actual 5 icons and 3 approved sprite strips, import only these
        run: |
          from pathlib import Path
          import io, json, hashlib
          from zipfile import ZipFile
          from PIL import Image
          
          root = Path('assets/library')
          src = root / 'capture/creatures/vipfer/Vipfer_5_icones_3_sprites_conserves_SANS_etreinte_20261122.zip'
          sha = hashlib.sha256(src.read_bytes()).hexdigest()
          assert sha == '0edc4481bc8aedf71cdbc43e227f87e1bd6438d68fb35935f66e8088e68e61cc', ('source changed',sha)
          catalog_path=Path('data/assets/catalog/global-visual-assets.v1.json')
          catalog=json.loads(catalog_path.read_text())
          assert catalog['catalogId']=='gensrpg-global-visual-assets'
          names={'morsure_a_ressort':('morsure-ressort','Morsure à ressort'),'etreinte_d_acier':('etreinte-acier','Étreinte d’acier'),'mue_tranchante':('mue-tranchante','Mue tranchante'),'couronne_d_eclats':('couronne-eclats','Couronne d’éclats'),'broyeur_serpentin':('broyeur-serpentin','Broyeur serpentin')}
          icons=[]
          sprites=[]
          provenance=[]
          existing={a['id'] for a in catalog['assets']}
          with ZipFile(src) as z:
              assert z.testzip() is None
              manifest=json.loads(z.read('manifest.json'))
              assert len(manifest['icons'])==5 and len(manifest['sprites'])==3
              assert set(manifest['icons'])==set(names)
              assert set(manifest['sprites'])=={'morsure_a_ressort','mue_tranchante','couronne_d_eclats'}
              def copy_validated(member,destination,expected_hash,dim,mode):
                  raw=z.read(member)
                  assert hashlib.sha256(raw).hexdigest()==expected_hash, ('modified',member)
                  with Image.open(io.BytesIO(raw)) as image:
                      image.load()
                      assert image.size==dim,(member,image.size)
                      assert image.getbbox() is not None,('empty',member)
                      alpha=image.getchannel('A') if 'A' in image.getbands() else None
                      print('VERIFIED_IMAGE',member,'size',dim,'format',image.format,'mode',image.mode,'alpha',alpha.getextrema() if alpha else 'none')
                      assert image.format==mode
                  destination.parent.mkdir(parents=True,exist_ok=True)
                  if destination.exists():
                      assert destination.read_bytes()==raw,('would-overwrite',str(destination))
                  else: destination.write_bytes(raw)
                  provenance.append({'sourceMember':member,'path':str(destination),'sha256':expected_hash,'bytes':len(raw)})
              for key,(slug,label) in names.items():
                  meta=manifest['icons'][key]
                  member=meta['file']
                  path=root/f'capture/icons/skills/vipfer/vipfer-{slug}.webp'
                  copy_validated(member,path,meta['sha256'],(128,128),'WEBP')
                  aid=f'pack:capture:icon-skill-vipfer-{slug}-v1'
                  assert aid not in existing,aid
                  icons.append(dict(id=aid,label=label,assetType='icon',mediaType='image',category='skill',tags=['capture','vipfer','skill','steel','author-upload'],source=dict(scope='pack',packId='capture',author='GenSRPG / sélection de l’auteur, ZIP conservé du 22 novembre 2026',license='project-internal'),resource=dict(file=str(path.relative_to(root)),mime='image/webp'),compatibility=dict(uses=['combat','capture','editor'])))
              for key in ('morsure_a_ressort','mue_tranchante','couronne_d_eclats'):
                  slug,label=names[key]
                  meta=manifest['sprites'][key]
                  path=root/f'capture/sprites/skills/vipfer/vipfer-{slug}.webp'
                  raw=z.read(meta['atlas'])
                  checksum=hashlib.sha256(raw).hexdigest()
                  copy_validated(meta['atlas'],path,checksum,(3072,512),'WEBP')
                  with Image.open(io.BytesIO(raw)) as im:
                      for i in range(6):
                          frame=im.crop((512*i,0,512*(i+1),512))
                          assert frame.getbbox() is not None,('empty frame',slug,i)
                  previewpath=root/f'capture/creatures/vipfer/previews/skills/vipfer-{slug}.gif'
                  gif=z.read(meta['preview'])
                  gifsha=hashlib.sha256(gif).hexdigest()
                  with Image.open(io.BytesIO(gif)) as im:
                      assert im.format=='GIF' and getattr(im,'n_frames',0)==6,(slug,getattr(im,'n_frames',0))
                  previewpath.parent.mkdir(parents=True,exist_ok=True)
                  assert not previewpath.exists() or previewpath.read_bytes()==gif
                  previewpath.write_bytes(gif)
                  provenance.append({'sourceMember':meta['preview'],'path':str(previewpath),'sha256':gifsha,'bytes':len(gif),'previewOnly':True})
                  aid=f'pack:capture:sprite-skill-vipfer-{slug}-v1'
                  assert aid not in existing,aid
                  kind={'morsure_a_ressort':'impact','mue_tranchante':'release','couronne_d_eclats':'travel'}[key]
                  sprites.append(dict(id=aid,label=label+' — 6 images',assetType='sprite',mediaType='image',category=kind,tags=['capture','vipfer','skill','steel',kind,'author-upload'],source=dict(scope='pack',packId='capture',author='GenSRPG / sélection de l’auteur, ZIP conservé du 22 novembre 2026',license='project-internal'),resource=dict(file=str(path.relative_to(root)),mime='image/webp',format='sprite-strip',frameCount=6,frameMs=120,playbackMode='once'),compatibility=dict(uses=['combat','capture','editor'])))
          catalog['assets'].extend(icons+sprites)
          catalog['counts']['assets']+=8
          catalog['counts']['icons']+=5
          catalog['counts']['sprites']+=3
          assert len(catalog['assets'])==catalog['counts']['assets']
          assert len({a['id'] for a in catalog['assets']})==len(catalog['assets'])
          catalog_path.write_text(json.dumps(catalog,ensure_ascii=False,indent=2)+'\n')
          proof = {
            'status':'imported_to_work_branch_pending_renderer_validation',
            'sourceArchive':str(src), 'sourceSha256':sha,'originalZIPPreserved':True,
            'assetIds':[a['id'] for a in icons+sprites],
            'files':provenance,'excludedEffects':['vipfer-etreinte-acier','vipfer-broyeur-serpentin'],
            'notes':'Sprites Étreinte et Broyeur absents du paquet auteur; ne pas substituer des silhouettes.'
          }
          proofpath=root/'capture/creatures/vipfer/vipfer-skill-media-proof-20261123.json'
          proofpath.write_text(json.dumps(proof,ensure_ascii=False,indent=2)+'\n')
          print('IMPORT_READY','ASSET_IDS',len(icons+sprites),'FILES',len(provenance),'SOURCE_ZIP_PRESERVED',src.exists(),'CATALOG_ENTRIES',len(catalog['assets']))
        shell: bash
      - name: Commit verified canonical assets on work branch, never on main or gh-pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/assets/catalog/global-visual-assets.v1.json assets/library/capture/creatures/vipfer/vipfer-skill-media-proof-20261123.json assets/library/capture/creatures/vipfer/previews/skills/ assets/library/capture/icons/skills/vipfer/ assets/library/capture/sprites/skills/vipfer/
          git diff --cached --stat
          if ! git diff --cached --quiet; then
            git commit -m "assets(vipfer): import 5 approved skill icons and 3 six-frame animations via single canonical catalog"
            git push origin HEAD:work/global-vipfer-media-20261123
          fi
