name: Import approved Sommeil Z Capture 12f WebP status sprite
on:
  push:
    branches:
      - work/lab-sommeil-z-vfx-2026-10-28
    paths:
      - scripts/import_sommeil_z_vfx.py
      - .github/workflows/import-sommeil-z-vfx.yml
permissions:
  contents: write
concurrency:
  group: sommei-z-import-2026-10-28
  cancel-in-progress: false
jobs:
  verify-and-import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Verify approved ZIP bytes CRC and 12 RGBA WebP, atlas pixel identity, animated preview; import
        run: python scripts/import_sommeil_z_vfx.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Full repository CI including real media/catalog sentinel
        run: npm run ci
      - name: Commit imported canonical assets on the work branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- _incoming/GENSRPG_SOMMEIL_Z_12F_WEBP.zip assets/library/capture/sprites/skills/sommeil_z data/assets/catalog/global-visual-assets.v1.json
          git commit -m 'assets(capture): import original Sommeil Z status animation'
          git push origin HEAD:work/lab-sommeil-z-vfx-2026-10-28
