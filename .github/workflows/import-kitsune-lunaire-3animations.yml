name: Import Kitsune lunar validated animations
on:
  push:
    branches:
      - work/kitsune-lunaire-3animations-raccord-2026-10-26
    paths:
      - .github/workflows/import-kitsune-lunaire-3animations.yml
      - scripts/import_kitsune_lunaire_3animations.py
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/work/kitsune-lunaire-3animations-raccord-2026-10-26'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/kitsune-lunaire-3animations-raccord-2026-10-26
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install Pillow==11.3.0
      - run: python scripts/import_kitsune_lunaire_3animations.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run ci
      - name: Commit approved animations
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/library/capture/creatures/creature_lunaire data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --check
          git commit -m 'assets: import three validated lunar animations'
          git push origin HEAD:work/kitsune-lunaire-3animations-raccord-2026-10-26
