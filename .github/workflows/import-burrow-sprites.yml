name: Import three approved underground sprite packs
on:
  push:
    branches:
      - work/lab-burrow-ground-fx-v2-2026-10-24
    paths:
      - scripts/import_burrow_sprites_v1.py
      - .github/workflows/import-burrow-sprites.yml
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install 'Pillow>=10,<13'
      - name: Preserve and atlas the 60 original RGBA sprites
        run: python scripts/import_burrow_sprites_v1.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm run ci
      - name: Commit verified media on isolated intake branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/library/capture/sprites/skills/burrow_terrain _incoming/
          git commit -m "assets(capture): publish 60 approved underground FX frames and 3 lossless atlases"
          git push origin HEAD:work/lab-burrow-ground-fx-v2-2026-10-24
