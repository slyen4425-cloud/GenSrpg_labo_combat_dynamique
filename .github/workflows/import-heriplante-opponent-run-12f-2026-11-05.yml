name: Import approved Heriplante opponent run 12f
on:
  push:
    branches:
      - work/lab-heriplante-opponent-run-12f-2026-11-05
    paths:
      - scripts/import_heriplante_opponent_run_12_2026_11_05.py
      - .github/workflows/import-heriplante-opponent-run-12f-2026-11-05.yml
permissions:
  contents: write
concurrency:
  group: import-heriplante-opponent-run-12f-2026-11-05
  cancel-in-progress: false
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "Pillow>=10,<13"
      - name: Verify approved ZIP source and preserve official master
        run: python scripts/import_heriplante_opponent_run_12_2026_11_05.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: All global-assets tests
        run: npm run ci
      - name: Commit verified media only to isolated work branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- assets/library/capture/creatures/heriplante/animations/movement/opponent data/assets/catalog/global-visual-assets.v1.json
          git diff --cached --quiet && { echo "No verified media generated"; exit 1; }
          git commit -m "assets(capture): register Hériplante opponent run 12f approved"
          git fetch origin work/lab-heriplante-opponent-run-12f-2026-11-05
          git rebase origin/work/lab-heriplante-opponent-run-12f-2026-11-05
          git push origin HEAD:work/lab-heriplante-opponent-run-12f-2026-11-05
