name: One-shot Fireball 2 HD assets

on:
  push:
    branches:
      - work/lab-global-assets-fireball-2-hd-2026-10-05
    paths:
      - .github/workflows/one-shot-fireball-2-hd.yml

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/lab-global-assets-fireball-2-hd-2026-10-05
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check pillow numpy

      - name: Generate and validate Boule de feu 2
        run: python tools/one-shot-fireball-2-hd.py

      - name: Verify generated contract
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          from PIL import Image
          root=Path("assets/library/capture/sprites/skills/fireball_2")
          assert len(list((root/"frames").glob("*.png")))==36
          assert len(list((root/"atlases").glob("*.webp")))==3
          for p in (root/"frames").glob("*.png"):
              im=Image.open(p)
              assert im.size==(512,512), (p,im.size)
              assert im.mode=="RGBA", (p,im.mode)
              assert im.getchannel("A").getextrema()[0] < 255, p
          for p in (root/"atlases").glob("*.webp"):
              im=Image.open(p)
              assert im.size==(6144,512), (p,im.size)
          cat=json.loads(Path("data/assets/catalog/global-visual-assets.v1.json").read_text())
          ids=[a["id"] for a in cat["assets"]]
          assert len(ids)==len(set(ids))
          wanted={
            "pack:capture:sprite-fireball-2-cast-01",
            "pack:capture:sprite-fireball-2-projectile-01",
            "pack:capture:sprite-fireball-2-impact-01",
          }
          assert wanted.issubset(ids)
          print("fireball2 asset contract GREEN")
          PY

      - name: Remove one-shot machinery
        run: |
          rm -f tools/one-shot-fireball-2-hd.py
          rm -f .github/workflows/one-shot-fireball-2-hd.yml

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "assets: publish Boule de feu 2 HD"
          git push origin HEAD:work/lab-global-assets-fireball-2-hd-2026-10-05
